<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Image Viewer</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .controls { margin-bottom: 20px; display: flex; gap: 10px; }
        select, button { padding: 10px; font-size: 16px; background: #333; color: #fff; border: 1px solid #555; border-radius: 4px; cursor: pointer; }
        .carousel { display: flex; align-items: center; gap: 15px; max-width: 800px; width: 100%; }
        .img-container { flex: 1; display: flex; justify-content: center; align-items: center; min-height: 400px; background: #1e1e1e; border-radius: 8px; overflow: hidden; }
        img { max-width: 100%; max-height: 70vh; object-fit: contain; display: none; }
        img.active { display: block; }
    </style>
</head>
<body>

    <h1>Chapter Viewer</h1>
    
    <div class="controls">
        <select id="chapterSelect">
            <option value="chapter1">Chapter 1</option>
            <option value="chapter2">Chapter 2</option>
            <option value="chapter3">Chapter 3</option>
        </select>
        <button id="prevBtn">&lt; Prev</button>
        <button id="nextBtn">Next &gt;</button>
    </div>

    <div class="carousel">
        <div class="img-container" id="imageContainer">
            <!-- Images will be injected here dynamically -->
        </div>
    </div>

    <script src="selector.js"></script>
</body>
</html>
